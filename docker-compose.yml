name: workflow
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: ${DB_USERNAME:-workflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workflow
      DB_USERNAME: ${DB_USERNAME:-workflow}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
