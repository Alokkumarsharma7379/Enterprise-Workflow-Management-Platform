spring:
  application:
    name: workflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET}
  issuer: workflow
  access-minutes: 15
  refresh-days: 7
  cookie-secure: ${COOKIE_SECURE:false}
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
